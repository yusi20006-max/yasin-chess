name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify production dist
        run: |
          test -d dist
          test -f dist/index.html
          echo "Production dist verified:"
          ls -la dist/
      - name: Upload PWA dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: yasin-chess-pwa-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
