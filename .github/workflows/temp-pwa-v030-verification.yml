name: Temporary v0.3.0 PWA Artifact Verification

on:
  push:
    branches:
      - 'verify/v0.3.0-pwa-artifact-issue-366'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tag-artifact:
    name: Build exact v0.3.0 tag and upload dist only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v4
        with:
          ref: ac283c851a9b3c6635a320faebfab455dcb075e4
          fetch-depth: 1

      - name: Verify checked-out release commit
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          expected="ac283c851a9b3c6635a320faebfab455dcb075e4"
          printf 'Expected release commit: %s\nActual checkout: %s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production PWA
        run: npm run build

      - name: Report dist checksums
        shell: bash
        run: |
          test -d dist
          test -n "$(find dist -type f -print -quit)"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum

      - name: Upload only dist directory
        uses: actions/upload-artifact@v4
        with:
          name: yasin-chess-v0.3.0-pwa-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
