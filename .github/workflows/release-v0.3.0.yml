name: Yasin Chess v0.3.0 Release

on:
  push:
    tags:
      - 'v0.3.0'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run build
      - run: npm run test
      - run: npm run android:init
      - run: npm run android:identity
      - name: Build Android artifacts
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon
      - name: Generate checksums
        run: |
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > SHA256SUMS
          find android/app/build/outputs/apk/release -type f -name '*.apk' -print0 | xargs -0 -r sha256sum >> SHA256SUMS
          find android/app/build/outputs/bundle/release -type f -name '*.aab' -print0 | xargs -0 -r sha256sum >> SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            SHA256SUMS
