name: Android Production Verification

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run build
      - run: npm run android:init
      - run: npm run android:identity
      - working-directory: android
        run: ./gradlew assembleRelease assembleDebug --no-daemon
      - name: Verify installable candidate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          wipe-data: true
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.yasin.chess 1
            adb shell pidof com.yasin.chess
      - uses: actions/upload-artifact@v4
        with:
          name: yasin-chess-v0.3.0-android-candidates
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/*.apk
