name: Phase 3 Final Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: npm run audit:offline-assets
      - run: npm run audit:network
      - run: npm run audit:android-offline
      - run: npm run audit:mobile-size
      - run: npm audit --audit-level=high
      - run: npm run android:init
      - run: npm run android:identity
      - working-directory: android
        run: ./gradlew assembleDebug --no-daemon
